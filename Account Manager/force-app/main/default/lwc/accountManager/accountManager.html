<template>
    <lightning-card title="Account Manager" icon-name="standard:account">
        <div class="slds-p-around_medium">

            <!-- ── Create Form ── -->
            <lightning-card title="Create Account" icon-name="utility:add">
                <div class="slds-p-around_small">
                    <lightning-input label="Account Name"    value={newName}     onchange={handleNameChange}></lightning-input>
                    <lightning-input label="Phone"           value={newPhone}    onchange={handlePhoneChange}></lightning-input>
                    <lightning-combobox
                        label="Industry"
                        value={newIndustry}
                        options={industryOptions}
                        onchange={handleIndustryChange}>
                    </lightning-combobox>
                    <div class="slds-m-top_small">
                        <lightning-button label="Create Account" variant="brand" onclick={handleCreate}></lightning-button>
                    </div>
                </div>
            </lightning-card>

            <!-- ── Accounts Table ── -->
            <div class="slds-m-top_medium">
                <template if:true={isLoading}>
                    <lightning-spinner alternative-text="Loading..."></lightning-spinner>
                </template>
                <template if:false={isLoading}>
                    <lightning-datatable
                        key-field="Id"
                        data={accounts}
                        columns={columns}
                        onrowaction={handleRowAction}>
                    </lightning-datatable>
                </template>
            </div>

        </div>
    </lightning-card>
</template>
